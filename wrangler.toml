name = "meridian-ops"
main = "worker/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "meridian-ops-db"
database_id = "5b594ec4-5ed2-4b15-a26a-8da85f14c316"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# The static frontend and the /api/* routes are served from this one
# Worker (single origin) via the assets binding above, not a separate
# Pages deployment — this avoids cross-origin cookies, which iOS Safari
# aggressively blocks in home-screen PWA mode. No [site] block here on
# purpose: that's the older/legacy Workers Sites mechanism and needs KV
# permissions we don't want or need.

# Set the PIN as a secret, never in this file:
#   wrangler secret put PIN
#
# After creating the D1 database with:
#   wrangler d1 create meridian-ops-db
# copy the database_id it prints into database_id above.
