name: Update program content

on:
  push:
    branches: [main]
    paths:
      - "programs/**"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate seed SQL for every program
        run: |
          for dir in programs/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/program.json" ]; then
              node scripts/seed-from-md.js "$dir" > "worker/seed-$name.sql"
            fi
          done
      - name: Apply each program's seed to D1
        run: |
          for f in worker/seed-*.sql; do
            [ -f "$f" ] || continue
            echo "Applying $f"
            npx wrangler d1 execute meridian-ops-db --remote --file="$f"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
